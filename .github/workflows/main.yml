name: Update vacancy report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 09:00 по Москве (UTC+3)

permissions:
  contents: read

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download vacancies and build report
        run: |
          python fetch_vacancy.py --all --force
          python check_vacancy.py --no-ai
          python build_site.py

      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker.js --assets=site --name=old-flower-c5e6 --compatibility-date=2026-07-30
